[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-reminder-bot"
version = "0.1.0"
description = "Voice-first Telegram personal assistant with reminders, projects, and memory"
requires-python = ">=3.9"
dependencies = [
  "aiogram>=3.20,<4",
  "aiohttp>=3.11,<4",
  "aiosqlite>=0.20,<1",
  "openai>=1.75,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[project.scripts]
reminder-bot = "assistant_bot.main:run"

[tool.setuptools.packages.find]
include = ["assistant_bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
